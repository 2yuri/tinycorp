name: Real Claude

# The tests that drive a real `claude` (pnpm test:claude): the spike v0 loop, and two
# Employees of one Company each keeping their own identity. Slow and they spend
# subscription usage, so they run on main and on demand, not on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: real-claude
  cancel-in-progress: false

jobs:
  real-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # A long-lived subscription token from `claude setup-token`, never an API key.
      # Forks and repos without the secret get an empty value and skip the test.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: No Claude credential
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; the real-Claude test is skipped."
      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Skip first-run onboarding
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: echo '{"hasCompletedOnboarding":true}' > "$HOME/.claude.json"
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          claude --version
          pnpm test:claude
