name: Feature request
description: Something TinyCorp should be able to do and cannot.
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Two things to read first, because they save everyone a round trip:
        [`docs/product.md`](https://github.com/2yuri/tinycorp/blob/main/docs/product.md) for what
        this app is for, and
        [`docs/decisions.md`](https://github.com/2yuri/tinycorp/blob/main/docs/decisions.md) for the
        numbered decisions already taken. Re-opening one of those is a conversation worth having —
        just say which number you are arguing with.

        A new Provider or a new forge has [its own form](https://github.com/2yuri/tinycorp/issues/new/choose).
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation you are in, not the feature. What happens today, and where it stops.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you think should happen
      description: What the app would do instead. A screen, a rule, a command — whatever shape it has.
    validations:
      required: true
  - type: textarea
    id: platforms
    attributes:
      label: How it works on the other platforms
      description: |
        Every feature here is designed for macOS, Windows and Linux at once. If your idea leans on
        something only one of them has — Touch ID, the menu bar, a keyring, `Cmd` — say what the
        other two do instead, even if the answer is "nothing, and that is fine".
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried, or what else would do
      description: Anything you worked around it with, and any other shape that would solve it.
